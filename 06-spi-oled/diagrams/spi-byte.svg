<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img"
     aria-label="SPI timing: four system clocks per bit. MOSI is driven on phase 0, SCLK rises on phase 2 when the SSD1331 samples, and the shift register advances on phase 3.">
  <style>
    :root { --ink:#1f2328; --mute:#656d76; --accent:#0969da; --warm:#9a6700; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --mute:#8b949e; --accent:#58a6ff; --warm:#d29922; }
    }
    .w   { stroke:var(--ink);    stroke-width:1.6; fill:none; }
    .ac  { stroke:var(--accent); stroke-width:1.8; fill:none; }
    .box { stroke:var(--ink);    stroke-width:1.3; fill:none; }
    .g   { stroke:var(--mute);   stroke-width:.5;  stroke-dasharray:2 3; }
    .mk  { stroke:var(--warm);   stroke-width:1.2; }
    .l   { fill:var(--ink);  font:12px ui-monospace,monospace; }
    .n   { fill:var(--mute); font:10px ui-monospace,monospace; }
    .t   { fill:var(--mute); font:11px ui-sans-serif,system-ui,sans-serif; }
    .tw  { fill:var(--warm); font:11px ui-sans-serif,system-ui,sans-serif; }
  </style>

  <!-- 8 system clocks of 44px from x=130 -->
  <g class="g">
    <path d="M130 50V232"/><path d="M174 50V232"/><path d="M218 50V232"/>
    <path d="M262 50V232"/><path d="M306 50V232"/><path d="M350 50V232"/>
    <path d="M394 50V232"/><path d="M438 50V232"/><path d="M482 50V232"/>
  </g>

  <!-- phase numbers -->
  <text class="l" x="8" y="40">phase</text>
  <g class="n">
    <text x="147" y="40">0</text><text x="191" y="40">1</text>
    <text x="235" y="40">2</text><text x="279" y="40">3</text>
    <text x="323" y="40">0</text><text x="367" y="40">1</text>
    <text x="411" y="40">2</text><text x="455" y="40">3</text>
  </g>

  <!-- system clock: 25 MHz -->
  <text class="l" x="8" y="74">clk_25mhz</text>
  <path class="w" d="M130 78 v-18 h22 v18 h22 v-18 h22 v18 h22 v-18 h22 v18 h22
                     v-18 h22 v18 h22 v-18 h22 v18 h22 v-18 h22 v18 h22
                     v-18 h22 v18 h22 v-18 h22 v18 h22"/>

  <!-- SCLK: low for phases 0-1, high for 2-3 -> 6.25 MHz -->
  <text class="l" x="8" y="134">oled_clk</text>
  <text class="t" x="8" y="148">6.25 MHz</text>
  <path class="ac" d="M130 138 h88 v-26 h88 v26 h88 v-26 h88 v26"/>

  <!-- MOSI: one bit per SCLK period, MSB first -->
  <text class="l" x="8" y="192">oled_mosi</text>
  <rect class="box" x="130" y="172" width="176" height="28" rx="3"/>
  <rect class="box" x="306" y="172" width="176" height="28" rx="3"/>
  <text class="l" x="205" y="191">bit 7</text>
  <text class="l" x="381" y="191">bit 6</text>

  <!-- markers on the three meaningful phases -->
  <path class="mk" d="M140 200 V 246"/>
  <path class="mk" d="M228 112 V 246"/>
  <path class="mk" d="M272 200 V 258"/>

  <text class="tw" x="104" y="262">drive MOSI
    <tspan x="104" dy="13">(phase 0)</tspan></text>
  <text class="tw" x="214" y="262">SSD1331 samples
    <tspan x="214" dy="13">(phase 2, rising SCLK)</tspan></text>
  <text class="tw" x="360" y="274">shift register advances (phase 3)</text>

  <text class="t" x="130" y="296">Four system clocks per bit: data is set up two clocks before the chip samples it.</text>
</svg>
