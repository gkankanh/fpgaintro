<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img"
     aria-label="A two-to-one multiplexer built from gates: sel is inverted, two AND gates mask a and b, and an OR gate combines them; beside it, the same circuit drawn as the usual trapezoid symbol.">
  <style>
    :root { --ink:#1f2328; --mute:#656d76; --accent:#0969da; --warm:#8a5a00; --panel:#f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --mute:#8b949e; --accent:#58a6ff; --warm:#d29922; --panel:#161b22; }
    }
    .g  { fill:var(--panel); stroke:var(--ink); stroke-width:1.6; stroke-linejoin:round; }
    .w  { stroke:var(--ink); stroke-width:1.3; fill:none; }
    .wa { stroke:var(--accent); stroke-width:1.5; fill:none; }
    .bub{ fill:var(--panel); stroke:var(--ink); stroke-width:1.6; }
    .dot{ fill:var(--ink); }
    .n  { fill:var(--ink);  font:12px ui-sans-serif,system-ui,sans-serif; font-weight:600; }
    .l  { fill:var(--ink);  font:11px ui-monospace,monospace; }
    .s  { fill:var(--mute); font:10px ui-monospace,monospace; }
    .t  { fill:var(--mute); font:11px ui-sans-serif,system-ui,sans-serif; }
    .ta { fill:var(--accent); font:11px ui-sans-serif,system-ui,sans-serif; }
  </style>
  <path class="g" d="M150,14 L194,36 L150,58 Z"/>
  <circle class="bub" cx="199" cy="36" r="5"/>
  <path class="g" d="M270,56 H297 A22,22 0 0 1 297,100 H270 Z"/>
  <path class="g" d="M270,150 H297 A22,22 0 0 1 297,194 H270 Z"/>
  <path class="g" d="M430,103 Q452,125 430,147 Q464,147 484,125 Q464,103 430,103 Z"/>
  <path class="w" d="M204,36 H226"/>
  <path class="w" d="M319,78 H341"/>
  <path class="w" d="M319,172 H341"/>
  <path class="w" d="M484,125 H506"/>
  <path class="w" d="M60,36 L150,36"/>
  <path class="w" d="M60,69 L270,69"/>
  <path class="w" d="M60,181 L270,181"/>
  <path class="w" d="M100,36 L100,163 L270,163"/>
  <circle class="dot" cx="100" cy="36" r="3"/>
  <path class="w" d="M226,36 L240,36 L240,87 L270,87"/>
  <path class="w" d="M341,78 L400,78 L400,116 L430,116"/>
  <path class="w" d="M341,172 L400,172 L400,134 L430,134"/>
  <text class="s" x="34" y="40">sel</text>
  <text class="s" x="44" y="73">a</text>
  <text class="s" x="44" y="185">b</text>
  <text class="s" x="512" y="129">y</text>
  <text class="s" x="214" y="28">~sel</text>
  <path class="g" d="M600,70 L660,96 L660,164 L600,190 Z"/>
  <text class="l" x="612" y="112">0</text>
  <text class="l" x="612" y="158">1</text>
  <path class="w" d="M630,190 L630,202"/>
  <text class="s" x="640" y="206">sel</text>
  <path class="w" d="M560,104 L600,104"/>
  <path class="w" d="M560,156 L600,156"/>
  <path class="w" d="M660,130 L700,130"/>
  <text class="s" x="546" y="108">a</text>
  <text class="s" x="546" y="160">b</text>
  <text class="s" x="706" y="134">y</text>
  <text class="t" x="556" y="26">the same circuit, drawn</text>
  <text class="t" x="556" y="42">the way you will draw it</text>
  <text class="t" x="556" y="58">once you trust it</text>
  <text class="t" x="60" y="244">y = (a &amp; ~sel) | (b &amp; sel) — three inputs, one function, and therefore one LUT4.</text>
  <text class="ta" x="60" y="266">What the gates make obvious and the symbol hides: both inputs are computed, every cycle.</text>
  <text class="ta" x="60" y="282">A multiplexer does not choose which path to evaluate. It evaluates both and throws one away.</text>
</svg>
