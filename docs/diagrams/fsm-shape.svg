<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" role="img"
     aria-label="The canonical three-part state machine: a state register, combinational next-state logic, and output logic, with Moore and Mealy output taps">
  <style>
    :root { --ink:#1f2328; --mute:#656d76; --accent:#0969da; --good:#1a7f37; --warm:#9a6700; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --mute:#8b949e; --accent:#58a6ff; --good:#3fb950; --warm:#d29922; }
    }
    .box  { fill:none; stroke:var(--ink); stroke-width:1.6; }
    .reg  { fill:none; stroke:var(--accent); stroke-width:1.8; }
    .w    { stroke:var(--ink); stroke-width:1.4; fill:none; }
    .fb   { stroke:var(--mute); stroke-width:1.3; fill:none; stroke-dasharray:5 4; }
    .mealy{ stroke:var(--warm); stroke-width:1.5; fill:none; }
    .l    { fill:var(--ink); font:11px ui-sans-serif,system-ui,sans-serif; }
    .m    { fill:var(--ink); font:11px ui-monospace,monospace; }
    .n    { fill:var(--mute); font:10px ui-sans-serif,system-ui,sans-serif; }
    .t    { fill:var(--mute); font:11px ui-sans-serif,system-ui,sans-serif; }
    .wk   { fill:var(--warm); font:10px ui-sans-serif,system-ui,sans-serif; }
  </style>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/>
    </marker>
    <marker id="a3w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--warm)"/>
    </marker>
  </defs>

  <!-- 2. next-state logic -->
  <rect class="box" x="118" y="52" width="150" height="58" rx="3"/>
  <text class="l" x="134" y="76">next-state logic</text>
  <text class="n" x="134" y="94">always @(*) — a pure function</text>

  <!-- 1. state register -->
  <rect class="reg" x="316" y="52" width="110" height="58" rx="3"/>
  <text class="l" x="334" y="76">state register</text>
  <text class="n" x="334" y="94">@(posedge clk)</text>

  <!-- 3. output logic -->
  <rect class="box" x="474" y="52" width="140" height="58" rx="3"/>
  <text class="l" x="490" y="76">output logic</text>
  <text class="n" x="490" y="94">Moore: state only</text>

  <!-- signal flow -->
  <path class="w" d="M34 81 H114" marker-end="url(#a3)"/>
  <text class="m" x="36" y="74">in</text>
  <path class="w" d="M268 81 H312" marker-end="url(#a3)"/>
  <text class="n" x="272" y="72">next</text>
  <path class="w" d="M426 81 H470" marker-end="url(#a3)"/>
  <text class="n" x="432" y="72">state</text>
  <path class="w" d="M614 81 H642" marker-end="url(#a3)"/>
  <text class="m" x="620" y="74">out</text>

  <!-- feedback: the only loop in the design -->
  <path class="fb" d="M450 110 V146 H160 V114" marker-end="url(#a3)"/>
  <text class="n" x="286" y="162">the current state, fed back — the only loop</text>

  <!-- Mealy tap -->
  <path class="mealy" d="M70 81 V196 H540 V114" marker-end="url(#a3w)"/>
  <text class="wk" x="214" y="212">Mealy adds this: the input reaches the output directly —</text>
  <text class="wk" x="214" y="228">one clock sooner, combinational, and no longer glitch-free</text>

  <text class="t" x="34" y="256">Splitting the register from the logic is not stylistic: it makes the only sequential element trivially obvious.</text>
</svg>
