<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img"
     aria-label="A 26-bit counter clocked at 25 MHz, with its top 8 bits tapped to drive 8 LEDs">
  <style>
    :root { --ink: #1f2328; --mute: #656d76; --accent: #0969da; --panel: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e6edf3; --mute: #8b949e; --accent: #58a6ff; --panel: #161b22; }
    }
    .box  { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
    .wire { stroke: var(--ink); stroke-width: 1.5; fill: none; }
    .tap  { stroke: var(--accent); stroke-width: 2; fill: none; }
    .lbl  { fill: var(--ink);  font: 13px ui-sans-serif, system-ui, sans-serif; }
    .sm   { fill: var(--mute); font: 11px ui-monospace, monospace; }
    .ac   { fill: var(--accent); font: 11px ui-monospace, monospace; }
    .led  { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
  </style>

  <!-- clock source -->
  <text class="lbl" x="8" y="80">clk_25mhz</text>
  <path class="wire" d="M78 75 H 150"/>
  <text class="sm" x="84" y="68">25 MHz</text>

  <!-- the counter -->
  <rect class="box" x="150" y="40" width="210" height="70" rx="4"/>
  <text class="lbl" x="178" y="70">26-bit counter</text>
  <text class="sm"  x="178" y="90">count &lt;= count + 1</text>

  <!-- full bus out -->
  <path class="wire" d="M360 75 H 420"/>
  <text class="sm" x="372" y="68">[25:0]</text>

  <!-- the tap -->
  <rect class="box" x="420" y="40" width="90" height="70" rx="4"/>
  <text class="lbl" x="432" y="72">tap</text>
  <text class="ac"  x="432" y="92">[25:18]</text>

  <path class="tap" d="M510 75 H 560"/>
  <text class="ac" x="520" y="68">8</text>

  <!-- LEDs -->
  <g>
    <circle class="led" cx="575" cy="48" r="7"/>
    <circle class="led" cx="575" cy="66" r="7"/>
    <circle class="led" cx="575" cy="84" r="7"/>
    <circle class="led" cx="575" cy="102" r="7"/>
    <text class="lbl" x="592" y="79">led</text>
  </g>

  <!-- annotation: why the tap -->
  <path class="wire" stroke-dasharray="3 3" d="M455 110 V 150 H 180 V 118"/>
  <text class="sm" x="180" y="170">bit 25 toggles every 2^25 clocks = 1.34 s; the low bits are</text>
  <text class="sm" x="180" y="186">far too fast to see, so only the top 8 reach the LEDs</text>
</svg>
