<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" role="img"
     aria-label="The single-cycle RV32I datapath. The program counter addresses instruction memory; the instruction reaches the decoder and the immediate generator; the register file supplies two operands to the ALU; the ALU result addresses data memory; a writeback multiplexer chooses between the ALU result, memory and PC plus four and returns it to the register file; a branch comparator and a next-PC multiplexer choose the following instruction.">
  <defs>
    <marker id="h" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#1f2328"/>
    </marker>
  </defs>
  <style>
    :root { --ink:#1f2328; --mute:#656d76; --accent:#0969da; --warm:#8a5a00; --panel:#f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --mute:#8b949e; --accent:#58a6ff; --warm:#d29922; --panel:#161b22; }
    }
    .b   { fill:var(--panel); stroke:var(--ink); stroke-width:1.3; }
    .reg { fill:var(--panel); stroke:var(--accent); stroke-width:2; }
    .w   { stroke:var(--ink); stroke-width:1.3; fill:none; }
    .ctl { stroke:var(--warm); stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .l   { fill:var(--ink);  font:12px ui-sans-serif,system-ui,sans-serif; }
    .s   { fill:var(--mute); font:10px ui-sans-serif,system-ui,sans-serif; }
    .c   { fill:var(--warm); font:10px ui-sans-serif,system-ui,sans-serif; }
    .t   { fill:var(--mute); font:11px ui-sans-serif,system-ui,sans-serif; }
  </style>
  <rect class="reg" x="28" y="150" width="58" height="46" rx="4"/>
  <text class="l" x="57" y="178" text-anchor="middle">PC</text>
  <rect class="b" x="126" y="142" width="94" height="62" rx="4"/>
  <text class="l" x="173" y="162" text-anchor="middle">instruction</text>
  <text class="s" x="173" y="178" text-anchor="middle">memory</text>
  <text class="s" x="173" y="192" text-anchor="middle">comb. read</text>
  <rect class="b" x="258" y="104" width="88" height="40" rx="4"/>
  <text class="l" x="302" y="129" text-anchor="middle">decode</text>
  <rect class="b" x="258" y="170" width="88" height="40" rx="4"/>
  <text class="l" x="302" y="195" text-anchor="middle">immgen</text>
  <rect class="b" x="386" y="110" width="100" height="96" rx="4"/>
  <text class="l" x="436" y="130" text-anchor="middle">register</text>
  <text class="s" x="436" y="146" text-anchor="middle">file</text>
  <text class="s" x="436" y="160" text-anchor="middle">2 read / 1 write</text>
  <rect class="b" x="524" y="128" width="74" height="68" rx="4"/>
  <text class="l" x="561" y="148" text-anchor="middle">ALU</text>
  <text class="s" x="561" y="164" text-anchor="middle">lesson 10</text>
  <rect class="b" x="636" y="128" width="96" height="68" rx="4"/>
  <text class="l" x="684" y="148" text-anchor="middle">data</text>
  <text class="s" x="684" y="164" text-anchor="middle">memory</text>
  <text class="s" x="684" y="178" text-anchor="middle">comb. read</text>
  <rect class="b" x="386" y="298" width="112" height="34" rx="4"/>
  <text class="l" x="442" y="320" text-anchor="middle">branch cmp</text>
  <rect class="b" x="560" y="366" width="136" height="34" rx="4"/>
  <text class="l" x="628" y="388" text-anchor="middle">writeback mux</text>
  <rect class="b" x="126" y="366" width="150" height="34" rx="4"/>
  <text class="l" x="201" y="388" text-anchor="middle">next-PC mux</text>
  <path class="w" d="M86 173 H 122" marker-end='url(#h)'/>
  <path class="w" d="M220 173 H 238 V 124 H 254" marker-end='url(#h)'/>
  <path class="w" d="M238 173 V 190 H 254" marker-end='url(#h)'/>
  <path class="w" d="M346 124 H 366 V 140 H 382" marker-end='url(#h)'/>
  <path class="w" d="M486 140 H 520" marker-end='url(#h)'/>
  <path class="w" d="M346 190 H 466 V 176 H 520" marker-end='url(#h)'/>
  <path class="w" d="M598 162 H 632" marker-end='url(#h)'/>
  <path class="w" d="M486 182 H 512 V 315 H 502" marker-end='url(#h)'/>
  <path class="w" d="M386 315 H 300 V 383 H 280" marker-end='url(#h)'/>
  <path class="w" d="M561 196 V 383 H 556" marker-end='url(#h)'/>
  <path class="w" d="M732 162 H 756 V 383 H 700" marker-end='url(#h)'/>
  <path class="w" d="M560 383 H 512 V 240 H 436 V 212" marker-end='url(#h)'/>
  <path class="w" d="M126 383 H 57 V 200" marker-end='url(#h)'/>
  <path class="ctl" d="M302 104 V 62 H 561 V 124" marker-end='url(#h)'/>
  <text class="c" x="316" y="56" text-anchor="start">control signals: ALU op, operand sources, write enables</text>
  <text class="s" x="560" y="358" text-anchor="start">ALU result / memory / PC+4</text>
  <text class="s" x="128" y="358" text-anchor="start">PC+4 / PC+imm / rs1+imm</text>
  <text class="s" x="300" y="258" text-anchor="start">rd1, rd2</text>
  <text class="t" x="28" y="440">Everything shown happens in ONE clock period, so the critical path is this whole chain in series.</text>
  <text class="t" x="28" y="458">That is why the core closes at 61 MHz where the ALU alone managed 116 — and why lesson 16 pipelines it.</text>
</svg>
