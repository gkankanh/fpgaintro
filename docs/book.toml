[book]
title       = "Digital Design on the ULX3S"
description = "A hands-on refresher in digital design, from a single flip-flop to a 32-bit RISC-V CPU, on a Lattice ECP5 FPGA with a fully open toolchain."
authors     = ["ULX3S Digital Design Course"]
language    = "en"
src         = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme    = "light"
preferred-dark-theme = "navy"
# Readers will want the source of every lesson, so link straight to it.
git-repository-url = "https://github.com/REPLACE_ME/ULX3S"
edit-url-template  = "https://github.com/REPLACE_ME/ULX3S/edit/main/{path}"
additional-css     = ["theme/course.css"]
mathjax-support    = false
copy-fonts         = true

[output.html.fold]
enable = true
level  = 1

[output.html.playground]
runnable = false

[output.html.search]
enable = true
limit-results = 20
