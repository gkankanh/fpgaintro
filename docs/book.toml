[book]
title       = "From Gates to a RISC-V CPU"
description = "Hands-on digital design on an FPGA, from a single logic gate to a 32-bit RISC-V CPU, with a fully open toolchain. Built on a Lattice ECP5."
authors     = ["The Open FPGA Course"]
language    = "en"
src         = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme    = "light"
preferred-dark-theme = "navy"
additional-css     = ["theme/course.css"]
mathjax-support    = false
copy-fonts         = true

[output.html.fold]
enable = true
level  = 1

[output.html.playground]
runnable = false

[output.html.search]
enable = true
limit-results = 20
